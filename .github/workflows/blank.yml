name: Atualização CEMADEN RJ

on:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizacao-cemaden-rj
  cancel-in-progress: false


jobs:

  atualizar-cemaden:

    name: Atualizar CEMADEN RJ

    runs-on: ubuntu-22.04

    timeout-minutes: 90

    env:
      CEMADEN_GPKG: /tmp/cemaden/rj_mun.gpkg
      CEMADEN_GPKG_URL: https://cisshiny.saude.rj.gov.br/docs/rj_mun.gpkg
      CEMADEN_OUTPUT: base_cemaden.rda

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # CONFIGURAR R
      # ==========================================================

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true


      # ==========================================================
      # DEPENDÊNCIAS DO SISTEMA
      # ==========================================================

      - name: Instalar dependências do sistema
        shell: bash
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            git \
            gdal-bin \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgeos-dev \
            libproj-dev \
            libgdal-dev \
            libudunits2-dev \
            libsqlite3-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

          echo ""
          echo "GDAL:"
          gdalinfo --version

          echo ""
          echo "OGR:"
          ogrinfo --version


      # ==========================================================
      # PACOTES R
      # ==========================================================

      - name: Instalar pacotes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::purrr
            any::httr
            any::dplyr
            any::stringr
            any::xml2
            any::rvest
            any::janitor
            any::magrittr
            any::rlang
            any::sf
            any::tibble


      # ==========================================================
      # PREPARAR DIRETÓRIO TEMPORÁRIO
      # ==========================================================

      - name: Preparar ambiente
        shell: bash
        run: |

          set -e

          mkdir -p /tmp/cemaden

          rm -f \
            /tmp/cemaden/rj_mun.gpkg \
            base_cemaden.rda \
            atualiza_cemaden.R

          echo "Ambiente preparado."


      # ==========================================================
      # BAIXAR MALHA MUNICIPAL
      # ==========================================================

      - name: Baixar GPKG municipal
        shell: bash
        run: |

          set -e

          echo "=================================================="
          echo "BAIXANDO MALHA MUNICIPAL"
          echo "=================================================="

          echo "URL:"
          echo "${CEMADEN_GPKG_URL}"

          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 5 \
            --retry-max-time 600 \
            --connect-timeout 30 \
            --max-time 600 \
            --user-agent "Mozilla/5.0 GitHub-Actions-CEMADEN-RJ" \
            "${CEMADEN_GPKG_URL}" \
            -o "${CEMADEN_GPKG}"

          if [ ! -f "${CEMADEN_GPKG}" ]; then
            echo "ERRO: GPKG não foi criado."
            exit 1
          fi

          if [ ! -s "${CEMADEN_GPKG}" ]; then
            echo "ERRO: GPKG está vazio."
            exit 1
          fi

          echo ""
          echo "GPKG baixado:"
          ls -lh "${CEMADEN_GPKG}"

          echo ""
          echo "Validando GPKG..."

          ogrinfo \
            -ro \
            "${CEMADEN_GPKG}"

          echo ""
          echo "GPKG validado."


      # ==========================================================
      # CRIAR SCRIPT R
      # ==========================================================

      - name: Criar script R
        shell: bash
        run: |

          cat > atualiza_cemaden.R <<'EOF_R'

          # ==========================================================
          # ATUALIZAÇÃO DOS DADOS DO CEMADEN
          #
          # Autoria:
          # Eduardo Peixoto - CIEVS/RJ
          #
          # Saída:
          # base_cemaden.rda
          #
          # O arquivo é salvo diretamente na raiz do repositório.
          # ==========================================================


          options(
            warn = 1,
            stringsAsFactors = FALSE
          )


          # ==========================================================
          # PACOTES
          # ==========================================================

          suppressPackageStartupMessages({

            library(purrr)
            library(httr)
            library(dplyr)
            library(stringr)
            library(xml2)
            library(rvest)
            library(janitor)
            library(magrittr)
            library(rlang)
            library(sf)
            library(tibble)

          })


          # ==========================================================
          # CONFIGURAÇÕES
          # ==========================================================

          gpkg_path <- Sys.getenv(
            "CEMADEN_GPKG",
            "/tmp/cemaden/rj_mun.gpkg"
          )


          output_path <- Sys.getenv(
            "CEMADEN_OUTPUT",
            "base_cemaden.rda"
          )


          base_url_http <-
            "http://painelcemadenrj.defesacivil.rj.gov.br"


          base_url_https <-
            "https://painelcemadenrj.defesacivil.rj.gov.br"


          cat("\n")
          cat("============================================================\n")
          cat("             ATUALIZAÇÃO CEMADEN/RJ\n")
          cat("============================================================\n")
          cat("\n")


          cat(
            "Início:",
            format(
              Sys.time(),
              "%Y-%m-%d %H:%M:%S"
            ),
            "\n"
          )


          cat(
            "GPKG:",
            gpkg_path,
            "\n"
          )


          cat(
            "Saída:",
            output_path,
            "\n"
          )


          # ==========================================================
          # FUNÇÃO ROBUSTA DE DOWNLOAD
          # ==========================================================

          baixar_html <- function(
            url,
            tentativas = 10
          ) {

            cat("\n")
            cat("------------------------------------------------------------\n")
            cat("URL:\n")
            cat(url)
            cat("\n")
            cat("------------------------------------------------------------\n")


            ultimo_erro <- NULL


            for (
              tentativa in seq_len(tentativas)
            ) {

              cat(
                "Tentativa ",
                tentativa,
                "/",
                tentativas,
                "\n",
                sep = ""
              )


              resultado <- tryCatch({

                resposta <- httr::GET(

                  url,

                  httr::config(
                    ssl_verifypeer = 0L,
                    ssl_verifyhost = 0L
                  ),

                  httr::timeout(
                    90
                  ),

                  httr::user_agent(

                    paste0(

                      "Mozilla/5.0 ",

                      "(X11; Linux x86_64) ",

                      "AppleWebKit/537.36 ",

                      "(KHTML, like Gecko) ",

                      "Chrome/154.0.0.0 ",

                      "Safari/537.36"

                    )

                  )

                )


                status <- httr::status_code(
                  resposta
                )


                cat(
                  "HTTP:",
                  status,
                  "\n"
                )


                if (
                  status < 200 ||
                  status >= 400
                ) {

                  stop(
                    paste(
                      "HTTP",
                      status
                    )
                  )

                }


                texto <- httr::content(

                  resposta,

                  as = "text",

                  encoding = "UTF-8"

                )


                if (
                  is.null(texto)
                ) {

                  stop(
                    "Resposta NULL."
                  )

                }


                if (
                  !nzchar(
                    trimws(texto)
                  )
                ) {

                  stop(
                    "Resposta vazia."
                  )

                }


                texto


              }, error = function(e) {

                ultimo_erro <<-
                  conditionMessage(e)


                cat(
                  "Erro:",
                  ultimo_erro,
                  "\n"
                )


                NULL

              })


              if (
                !is.null(resultado)
              ) {

                cat(
                  "Acesso realizado com sucesso.\n"
                )

                return(
                  resultado
                )

              }


              if (
                tentativa < tentativas
              ) {

                espera <- min(
                  5 * tentativa,
                  30
                )


                cat(
                  "Aguardando ",
                  espera,
                  " segundos...\n",
                  sep = ""
                )


                Sys.sleep(
                  espera
                )

              }

            }


            stop(

              paste(

                "Falha ao acessar",

                url,

                "após",

                tentativas,

                "tentativas.",

                "Último erro:",

                ultimo_erro

              ),

              call. = FALSE

            )

          }


          # ==========================================================
          # VALIDAR GPKG
          # ==========================================================

          if (
            !file.exists(gpkg_path)
          ) {

            stop(

              paste(
                "GPKG não encontrado:",
                gpkg_path
              ),

              call. = FALSE

            )

          }


          if (
            file.info(gpkg_path)$size <= 0
          ) {

            stop(
              "GPKG está vazio.",
              call. = FALSE
            )

          }


          # ==========================================================
          # WEBSCRAPING 1
          # HIDROLÓGICO + GEOLÓGICO
          # ==========================================================

          cat("\n")
          cat("============================================================\n")
          cat("WEBSCRAPING 1\n")
          cat("HIDROLÓGICO + GEOLÓGICO\n")
          cat("============================================================\n")


          base1 <- purrr::map(

            c(
              "hidro",
              "geo"
            ),

            function(tipo) {

              url <- paste0(

                base_url_http,

                "/monitoramento/v2/municipio/?action=",

                tipo

              )


              html <- baixar_html(
                url
              )


              tabelas <- html |>

                xml2::read_html() |>

                rvest::html_table()


              if (
                length(tabelas) < 1
              ) {

                stop(

                  paste(
                    "Nenhuma tabela encontrada para",
                    tipo
                  ),

                  call. = FALSE

                )

              }


              tabela <- purrr::pluck(

                tabelas,

                1

              )


              if (
                nrow(tabela) < 2
              ) {

                stop(

                  paste(
                    "Tabela vazia para",
                    tipo
                  ),

                  call. = FALSE

                )

              }


              tabela |>

                magrittr::extract(

                  -nrow(.),

                  ,

                  drop = FALSE

                ) |>

                janitor::clean_names()

            }

          ) |>

            purrr::reduce(

              full_join,

              by = "municipio"

            ) |>

            janitor::clean_names() |>

            dplyr::arrange(
              municipio
            )


          # ==========================================================
          # RENOMEAR COLUNAS
          # ==========================================================

          base1 <- rlang::set_names(

            base1,

            gsub(
              "_x",
              "_hidrologico",
              names(base1)
            )

          )


          base1 <- rlang::set_names(

            base1,

            gsub(
              "_y",
              "_geologico",
              names(base1)
            )

          )


          cat(
            "Registros base1:",
            nrow(base1),
            "\n"
          )


          # ==========================================================
          # WEBSCRAPING 2
          # METEOROLÓGICO + INCÊNDIO
          # ==========================================================

          cat("\n")
          cat("============================================================\n")
          cat("WEBSCRAPING 2\n")
          cat("METEOROLÓGICO + INCÊNDIO\n")
          cat("============================================================\n")


          base2 <- purrr::map(

            c(
              "1",
              "2"
            ),

            function(tipo) {

              url <- paste0(

                base_url_http,

                "/monitoramento/v2/mapa/redec.php?action=",

                tipo

              )


              html <- baixar_html(
                url
              )


              resultado <- html |>

                xml2::read_html() |>

                rvest::html_elements(

                  xpath =
                    '//*[contains(concat( " ", @class, " " ), concat( " ", "bg-success", " " ))]'

                ) |>

                rvest::html_text() |>

                tibble::as_tibble() |>

                dplyr::mutate(

                  regiao =
                    stringr::str_extract(

                      value,

                      "^[^-]+"

                    ) |>

                    stringr::str_trim(),


                  nivel =
                    stringr::str_extract(

                      value,

                      "(?<=- ).*(?=-)"

                    ) |>

                    stringr::str_trim()

                ) |>

                dplyr::select(
                  -value
                ) |>

                janitor::clean_names()


              if (
                nrow(resultado) == 0
              ) {

                stop(

                  paste(
                    "Nenhuma região encontrada para action",
                    tipo
                  ),

                  call. = FALSE

                )

              }


              resultado

            }

          ) |>

            purrr::reduce(

              full_join,

              by = "regiao"

            ) |>

            janitor::clean_names() |>

            dplyr::mutate(

              risco_metereologico =
                nivel_x,

              risco_incendio =
                nivel_y

            ) |>

            dplyr::select(

              -nivel_x,

              -nivel_y

            )


          cat(
            "Regiões base2:",
            nrow(base2),
            "\n"
          )


          # ==========================================================
          # CONSOLIDAÇÃO
          # ==========================================================

          cat("\n")
          cat("============================================================\n")
          cat("CONSOLIDAÇÃO\n")
          cat("============================================================\n")


          base3 <- base1 |>

            dplyr::select(

              municipio,

              redec_hidrologico,

              risco_atual_hidrologico,

              risco_atual_geologico

            ) |>

            dplyr::mutate(

              regiao =
                stringr::str_squish(
                  redec_hidrologico
                )

            ) |>

            dplyr::full_join(

              base2,

              by = "regiao"

            ) |>

            dplyr::select(

              regiao,

              municipio,

              risco_atual_hidrologico,

              risco_atual_geologico,

              risco_metereologico,

              risco_incendio

            )


          cat(
            "Registros base3:",
            nrow(base3),
            "\n"
          )


          # ==========================================================
          # CARREGAR MALHA
          # ==========================================================

          cat("\n")
          cat("============================================================\n")
          cat("CARREGANDO MALHA MUNICIPAL\n")
          cat("============================================================\n")


          rj_mun <- sf::read_sf(

            gpkg_path,

            quiet = TRUE

          )


          cat(
            "Registros originais:",
            nrow(rj_mun),
            "\n"
          )


          if (
            !"name_muni" %in% names(rj_mun)
          ) {

            stop(

              "Coluna 'name_muni' não encontrada no GPKG.",

              call. = FALSE

            )

          }


          rj_mun <- rj_mun |>

            dplyr::mutate(

              mun_tipo_6 =
                toupper(
                  name_muni
                )

            ) |>

            dplyr::full_join(

              base3,

              by = c(
                "mun_tipo_6" =
                  "municipio"
              )

            )


          # ==========================================================
          # WEBSCRAPING 3
          # HISTÓRICO DA REDEC
          # ==========================================================

          cat("\n")
          cat("============================================================\n")
          cat("WEBSCRAPING 3\n")
          cat("HISTÓRICO DA REDEC\n")
          cat("============================================================\n")


          url_historico <- paste0(

            base_url_https,

            "/monitoramento/v2/mapa/redec.php?action=2"

          )


          html_historico <- baixar_html(

            url_historico

          )


          page <- xml2::read_html(

            html_historico

          )


          ul_element <- rvest::html_elements(

            page,

            "ul.list-group"

          )


          if (
            length(ul_element) == 0
          ) {

            stop(

              "ul.list-group não encontrado.",

              call. = FALSE

            )

          }


          html_table <- rvest::html_text(

            ul_element

          )


          table_rows <- strsplit(

            html_table,

            "Histórico da Redec"

          )[[1]]


          table_rows <- trimws(

            table_rows

          )


          table_rows <- table_rows[

            nzchar(
              table_rows
            )

          ]


          if (
            length(table_rows) == 0
          ) {

            stop(

              "Nenhuma linha encontrada no histórico da REDEC.",

              call. = FALSE

            )

          }


          # ==========================================================
          # TRANSFORMAR HISTÓRICO
          # ==========================================================

          table_data <- lapply(

            table_rows,

            function(row) {

              region <- gsub(

                " - .*",

                "",

                row

              )


              status <- gsub(

                ".* - (.*?) - .*",

                "\\1",

                row

              )


              history <- gsub(

                ".*Histórico da Redec(.*)",

                "\\1",

                row

              )


              data.frame(

                Region =
                  region,

                Status =
                  status,

                History =
                  history,

                stringsAsFactors =
                  FALSE

              )

            }

          )


          table_df <- do.call(

            rbind,

            table_data

          )


          table_df <- head(

            table_df,

            11

          )


          # ==========================================================
          # EXTRAIR STATUS
          # ==========================================================

          table_df$Status <-

            stringr::str_extract(

              table_df$Status,

              "(?<=-).*"

            ) |>

            stringr::str_trim()


          table_df$regiao <-
            table_df$Region


          # ==========================================================
          # JOIN FINAL
          # ==========================================================

          a <- dplyr::full_join(

            rj_mun,

            table_df,

            by = "regiao"

          )


          # ==========================================================
          # STATUS -> RISCO DE INCÊNDIO
          # ==========================================================

          if (
            "Status" %in% names(a)
          ) {

            a$risco_incendio <-
              a$Status

            a$Status <- NULL

          }


          # ==========================================================
          # CORREÇÃO ORIGINAL
          # ==========================================================

          if (
            nrow(a) >= 93
          ) {

            a$risco_atual_hidrologico[5] <-
              a$risco_atual_hidrologico[93]


            a$risco_atual_geologico[5] <-
              a$risco_atual_geologico[93]


            a$risco_incendio[5] <-
              a$risco_incendio[93]


            if (
              "Region" %in% names(a)
            ) {

              a$Region[5] <-
                "BAIXADA LITORÂNEA"

            }


            a$regiao[5] <-
              "BAIXADA LITORÂNEA"

          }


          # ==========================================================
          # MANTER EXATAMENTE 92 MUNICÍPIOS
          # ==========================================================

          rj_mun <- head(

            a,

            92

          )


          # ==========================================================
          # VALIDAÇÃO
          # ==========================================================

          cat("\n")
          cat("============================================================\n")
          cat("VALIDAÇÃO FINAL\n")
          cat("============================================================\n")


          cat(
            "Linhas:",
            nrow(rj_mun),
            "\n"
          )


          cat(
            "Colunas:",
            ncol(rj_mun),
            "\n"
          )


          if (
            nrow(rj_mun) != 92
          ) {

            stop(

              paste0(

                "ERRO: esperado 92 municípios; encontrado ",

                nrow(rj_mun)

              ),

              call. = FALSE

            )

          }


          colunas_obrigatorias <- c(

            "regiao",

            "risco_atual_hidrologico",

            "risco_atual_geologico",

            "risco_metereologico",

            "risco_incendio"

          )


          faltantes <- setdiff(

            colunas_obrigatorias,

            names(rj_mun)

          )


          if (
            length(faltantes) > 0
          ) {

            stop(

              paste0(

                "ERRO: colunas ausentes: ",

                paste(
                  faltantes,
                  collapse = ", "
                )

              ),

              call. = FALSE

            )

          }


          municipios_validos <- sum(

            !is.na(
              rj_mun$name_muni
            )

          )


          cat(
            "Municípios válidos:",
            municipios_validos,
            "\n"
          )


          if (
            municipios_validos != 92
          ) {

            stop(

              paste0(

                "ERRO: encontrados ",

                municipios_validos,

                " municípios válidos; esperado 92."

              ),

              call. = FALSE

            )

          }


          # ==========================================================
          # SALVAR SOMENTE NA RAIZ DO PROJETO
          # ==========================================================

          cat("\n")
          cat("============================================================\n")
          cat("SALVANDO BASE\n")
          cat("============================================================\n")


          save(

            rj_mun,

            file = output_path

          )


          # ==========================================================
          # VALIDAR ARQUIVO
          # ==========================================================

          if (
            !file.exists(output_path)
          ) {

            stop(

              "ERRO: base_cemaden.rda não foi criada.",

              call. = FALSE

            )

          }


          tamanho <- file.info(
            output_path
          )$size


          if (
            is.na(tamanho) ||
            tamanho <= 0
          ) {

            stop(

              "ERRO: base_cemaden.rda está vazia.",

              call. = FALSE

            )

          }


          cat(
            "Arquivo:",
            normalizePath(
              output_path,
              mustWork = FALSE
            ),
            "\n"
          )


          cat(
            "Tamanho:",
            tamanho,
            "bytes\n"
          )


          cat(
            "Municípios:",
            nrow(rj_mun),
            "\n"
          )


          # ==========================================================
          # FINAL
          # ==========================================================

          cat("\n")
          cat("============================================================\n")
          cat(" CEMADEN/RJ ATUALIZADO COM SUCESSO\n")
          cat("============================================================\n")


          cat(
            "Fim:",
            format(
              Sys.time(),
              "%Y-%m-%d %H:%M:%S"
            ),
            "\n"
          )


          EOF_R


      # ==========================================================
      # EXECUTAR SCRIPT
      # ==========================================================

      - name: Executar atualização
        shell: bash
        run: |

          set -e

          echo "=================================================="
          echo "EXECUTANDO SCRAPING CEMADEN"
          echo "=================================================="


          Rscript atualiza_cemaden.R


          echo ""
          echo "=================================================="
          echo "VALIDAÇÃO DO RESULTADO"
          echo "=================================================="


          if [ ! -f base_cemaden.rda ]; then

            echo "ERRO: base_cemaden.rda não existe."

            exit 1

          fi


          if [ ! -s base_cemaden.rda ]; then

            echo "ERRO: base_cemaden.rda está vazio."

            exit 1

          fi


          echo ""
          echo "Arquivo gerado:"

          ls -lh base_cemaden.rda


      # ==========================================================
      # VALIDAR RDA
      # ==========================================================

      - name: Validar RDA
        shell: bash
        run: |

          set -e

          Rscript - <<'EOF_R'

          load(
            "base_cemaden.rda"
          )


          if (
            !exists("rj_mun")
          ) {

            stop(
              "Objeto rj_mun não encontrado."
            )

          }


          if (
            !inherits(
              rj_mun,
              "sf"
            )
          ) {

            stop(
              "Objeto rj_mun não é sf."
            )

          }


          if (
            nrow(rj_mun) != 92
          ) {

            stop(

              paste0(

                "Esperados 92 municípios; encontrados ",

                nrow(rj_mun)

              )

            )

          }


          cat(
            "RDA VALIDADO COM SUCESSO\n"
          )


          cat(
            "Municípios:",
            nrow(rj_mun),
            "\n"
          )


          cat(
            "Colunas:",
            ncol(rj_mun),
            "\n"
          )

          EOF_R


      # ==========================================================
      # COMMIT E PUSH
      #
      # O ÚNICO ARQUIVO GERADO/PERSISTIDO PELO WORKFLOW É:
      #
      #     base_cemaden.rda
      #
      # NA RAIZ DO REPOSITÓRIO.
      # ==========================================================

      - name: Salvar base na raiz do projeto
        shell: bash
        run: |

          set -e

          echo "=================================================="
          echo "SALVANDO BASE NA RAIZ DO PROJETO"
          echo "=================================================="


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            base_cemaden.rda


          if git diff --cached --quiet; then

            echo ""
            echo "A base não sofreu alterações."

          else

            git commit \
              -m "Atualização CEMADEN RJ"


            git pull \
              origin \
              main \
              --rebase \
              --autostash


            git push \
              origin \
              HEAD:main


            echo ""
            echo "=================================================="
            echo "BASE SALVA COM SUCESSO"
            echo "=================================================="

          fi


          echo ""
          echo "Arquivo final na raiz:"

          ls -lh \
            base_cemaden.rda
