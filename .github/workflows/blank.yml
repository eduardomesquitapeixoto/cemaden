name: Atualização CEMADEN RJ

on:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizacao-cemaden-rj
  cancel-in-progress: false

jobs:

  atualizar-cemaden:

    runs-on: ubuntu-22.04

    timeout-minutes: 90

    env:
      CEMADEN_GPKG: /tmp/cemaden/rj_mun.gpkg
      CEMADEN_OUTPUT: base_cemaden.rda
      CEMADEN_GPKG_URL: https://cisshiny.saude.rj.gov.br/docs/rj_mun.gpkg

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # CONFIGURAR R
      # ==========================================================

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true


      # ==========================================================
      # DEPENDÊNCIAS DO SISTEMA
      # ==========================================================

      - name: Instalar dependências do sistema
        shell: bash
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            git \
            gdal-bin \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgeos-dev \
            libproj-dev \
            libgdal-dev \
            libudunits2-dev \
            libsqlite3-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

          echo "GDAL:"
          gdalinfo --version

          echo "OGR:"
          ogrinfo --version


      # ==========================================================
      # PACOTES R
      # ==========================================================

      - name: Instalar dependências R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:

          packages: |
            any::logger
            any::purrr
            any::httr
            any::dplyr
            any::stringr
            any::xml2
            any::rvest
            any::janitor
            any::magrittr
            any::rlang
            any::sf

          needs: |
            any::logger
            any::purrr
            any::httr
            any::dplyr
            any::stringr
            any::xml2
            any::rvest
            any::janitor
            any::magrittr
            any::rlang
            any::sf


      # ==========================================================
      # BAIXAR MALHA MUNICIPAL
      # ==========================================================

      - name: Baixar malha municipal RJ
        shell: bash
        run: |

          set -e

          mkdir -p /tmp/cemaden

          echo "=================================================="
          echo "BAIXANDO MALHA MUNICIPAL"
          echo "=================================================="

          echo "URL:"
          echo "${CEMADEN_GPKG_URL}"

          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 5 \
            --retry-max-time 300 \
            --connect-timeout 30 \
            --max-time 300 \
            --user-agent "Mozilla/5.0 GitHub-Actions-CEMADEN-RJ" \
            "${CEMADEN_GPKG_URL}" \
            -o "${CEMADEN_GPKG}"

          if [ ! -s "${CEMADEN_GPKG}" ]; then
            echo "ERRO: GPKG não foi baixado."
            exit 1
          fi

          echo ""
          echo "Arquivo baixado:"
          ls -lh "${CEMADEN_GPKG}"

          echo ""
          echo "Validando GPKG..."

          ogrinfo \
            -ro \
            "${CEMADEN_GPKG}"

          echo ""
          echo "GPKG validado com sucesso."


      # ==========================================================
      # CRIAR SCRIPT R INLINE
      # ==========================================================

      - name: Criar script CEMADEN
        shell: bash
        run: |

          cat > atualiza_cemaden.R <<'EOF_R'

          options(
            warn = 1,
            stringsAsFactors = FALSE
          )


          # ======================================================
          # PACOTES
          # ======================================================

          suppressPackageStartupMessages({

            library(purrr)
            library(httr)
            library(dplyr)
            library(stringr)
            library(xml2)
            library(rvest)
            library(janitor)
            library(magrittr)
            library(rlang)
            library(sf)

          })


          # ======================================================
          # CONFIGURAÇÃO
          # ======================================================

          gpkg_path <- Sys.getenv(
            "CEMADEN_GPKG",
            "/tmp/cemaden/rj_mun.gpkg"
          )

          output_path <- Sys.getenv(
            "CEMADEN_OUTPUT",
            "base_cemaden.rda"
          )

          base_url <-
            "https://painelcemadenrj.defesacivil.rj.gov.br"


          cat("\n")
          cat("====================================================\n")
          cat(" ATUALIZAÇÃO DOS DADOS DO CEMADEN/RJ\n")
          cat("====================================================\n")

          cat(
            "Início:",
            format(
              Sys.time(),
              "%Y-%m-%d %H:%M:%S"
            ),
            "\n"
          )


          # ======================================================
          # FUNÇÃO ROBUSTA DE DOWNLOAD
          # ======================================================

          baixar_html <- function(
            url,
            tentativas = 10
          ) {

            cat("\n")
            cat("URL:", url, "\n")

            ultimo_erro <- NULL

            for (
              tentativa in seq_len(tentativas)
            ) {

              cat(
                "Tentativa",
                tentativa,
                "/",
                tentativas,
                "\n"
              )

              resultado <- tryCatch({

                resposta <- httr::GET(

                  url,

                  httr::config(
                    ssl_verifypeer = 0L
                  ),

                  httr::timeout(90),

                  httr::user_agent(
                    paste0(
                      "Mozilla/5.0 ",
                      "(X11; Linux x86_64) ",
                      "AppleWebKit/537.36 ",
                      "(KHTML, like Gecko) ",
                      "Chrome/154.0.0.0 ",
                      "Safari/537.36"
                    )
                  )

                )


                status <- httr::status_code(
                  resposta
                )


                cat(
                  "HTTP:",
                  status,
                  "\n"
                )


                if (
                  status < 200 ||
                  status >= 400
                ) {

                  stop(
                    paste(
                      "HTTP",
                      status
                    )
                  )

                }


                texto <- httr::content(
                  resposta,
                  as = "text",
                  encoding = "UTF-8"
                )


                if (
                  is.null(texto) ||
                  !nzchar(trimws(texto))
                ) {

                  stop(
                    "Resposta vazia"
                  )

                }


                texto


              }, error = function(e) {

                ultimo_erro <<-
                  conditionMessage(e)

                cat(
                  "ERRO:",
                  ultimo_erro,
                  "\n"
                )

                NULL

              })


              if (
                !is.null(resultado)
              ) {

                return(
                  resultado
                )

              }


              espera <- min(
                5 * tentativa,
                30
              )


              cat(
                "Aguardando",
                espera,
                "segundos...\n"
              )


              Sys.sleep(
                espera
              )

            }


            stop(
              paste(
                "Falha ao acessar",
                url,
                "|",
                ultimo_erro
              ),
              call. = FALSE
            )

          }


          # ======================================================
          # VALIDAR GPKG
          # ======================================================

          if (
            !file.exists(gpkg_path)
          ) {

            stop(
              paste(
                "GPKG não encontrado:",
                gpkg_path
              ),
              call. = FALSE
            )

          }


          # ======================================================
          # WEBSCRAPING 1
          # HIDROLÓGICO + GEOLÓGICO
          # ======================================================

          cat("\n")
          cat("====================================================\n")
          cat(" WEBSCRAPING 1\n")
          cat(" HIDROLÓGICO + GEOLÓGICO\n")
          cat("====================================================\n")


          base1 <- purrr::map(

            c(
              "hidro",
              "geo"
            ),

            function(tipo) {

              url <- paste0(

                base_url,

                "/monitoramento/v2/municipio/?action=",

                tipo

              )


              html <- baixar_html(
                url
              )


              tabelas <- html |>

                xml2::read_html() |>

                rvest::html_table()


              if (
                length(tabelas) < 1
              ) {

                stop(
                  paste(
                    "Nenhuma tabela encontrada:",
                    tipo
                  )
                )

              }


              tabela <- purrr::pluck(
                tabelas,
                1
              )


              if (
                nrow(tabela) < 2
              ) {

                stop(
                  paste(
                    "Tabela vazia:",
                    tipo
                  )
                )

              }


              tabela |>

                magrittr::extract(
                  -nrow(.),
                  ,
                  drop = FALSE
                ) |>

                janitor::clean_names()

            }

          ) |>

            purrr::reduce(
              full_join,
              by = "municipio"
            ) |>

            janitor::clean_names() |>

            arrange(
              municipio
            )


          base1 <- rlang::set_names(

            base1,

            gsub(
              "_x",
              "_hidrologico",
              names(base1)
            )

          )


          base1 <- rlang::set_names(

            base1,

            gsub(
              "_y",
              "_geologico",
              names(base1)
            )

          )


          cat(
            "Registros:",
            nrow(base1),
            "\n"
          )


          # ======================================================
          # WEBSCRAPING 2
          # METEOROLÓGICO + INCÊNDIO
          # ======================================================

          cat("\n")
          cat("====================================================\n")
          cat(" WEBSCRAPING 2\n")
          cat(" METEOROLÓGICO + INCÊNDIO\n")
          cat("====================================================\n")


          base2 <- purrr::map(

            c(
              "1",
              "2"
            ),

            function(tipo) {

              url <- paste0(

                base_url,

                "/monitoramento/v2/mapa/redec.php?action=",

                tipo

              )


              html <- baixar_html(
                url
              )


              resultado <- html |>

                xml2::read_html() |>

                rvest::html_elements(

                  xpath =
                    '//*[contains(concat( " ", @class, " " ), concat( " ", "bg-success", " " ))]'

                ) |>

                rvest::html_text() |>

                tibble::as_tibble() |>

                mutate(

                  regiao =
                    str_extract(
                      value,
                      "^[^-]+"
                    ) |>
                    str_trim(),

                  nivel =
                    str_extract(
                      value,
                      "(?<=- ).*(?=-)"
                    ) |>
                    str_trim()

                ) |>

                select(
                  -value
                ) |>

                clean_names()


              if (
                nrow(resultado) == 0
              ) {

                stop(
                  paste(
                    "Nenhuma região encontrada:",
                    tipo
                  )
                )

              }


              resultado

            }

          ) |>

            purrr::reduce(
              full_join,
              by = "regiao"
            ) |>

            clean_names() |>

            mutate(

              risco_metereologico =
                nivel_x,

              risco_incendio =
                nivel_y

            ) |>

            select(
              -nivel_x,
              -nivel_y
            )


          cat(
            "Regiões:",
            nrow(base2),
            "\n"
          )


          # ======================================================
          # CONSOLIDAÇÃO
          # ======================================================

          base3 <- base1 |>

            select(

              municipio,

              redec_hidrologico,

              risco_atual_hidrologico,

              risco_atual_geologico

            ) |>

            mutate(

              regiao =
                str_squish(
                  redec_hidrologico
                )

            ) |>

            full_join(

              base2,

              by = "regiao"

            ) |>

            select(

              regiao,

              municipio,

              risco_atual_hidrologico,

              risco_atual_geologico,

              risco_metereologico,

              risco_incendio

            )


          # ======================================================
          # MALHA MUNICIPAL
          # ======================================================

          cat("\n")
          cat("====================================================\n")
          cat(" MALHA MUNICIPAL\n")
          cat("====================================================\n")


          rj_mun <- sf::read_sf(

            gpkg_path,

            quiet = TRUE

          )


          cat(
            "Registros da malha:",
            nrow(rj_mun),
            "\n"
          )


          if (
            !"name_muni" %in% names(rj_mun)
          ) {

            stop(
              "Coluna name_muni não encontrada."
            )

          }


          rj_mun <- rj_mun |>

            mutate(

              mun_tipo_6 =
                toupper(
                  name_muni
                )

            ) |>

            full_join(

              base3,

              by = c(
                "mun_tipo_6" =
                  "municipio"
              )

            )


          # ======================================================
          # WEBSCRAPING 3
          # HISTÓRICO DA REDEC
          # ======================================================

          cat("\n")
          cat("====================================================\n")
          cat(" WEBSCRAPING 3\n")
          cat(" HISTÓRICO DA REDEC\n")
          cat("====================================================\n")


          url_historico <- paste0(

            base_url,

            "/monitoramento/v2/mapa/redec.php?action=2"

          )


          page <- baixar_html(

            url_historico

          ) |>

            xml2::read_html()


          ul_element <- rvest::html_elements(

            page,

            "ul.list-group"

          )


          html_table <- rvest::html_text(

            ul_element

          )


          if (
            length(html_table) == 0
          ) {

            stop(
              "ul.list-group não encontrado."
            )

          }


          table_rows <- strsplit(

            html_table,

            "Histórico da Redec"

          )[[1]]


          table_rows <- trimws(
            table_rows
          )


          table_data <- lapply(

            table_rows,

            function(row) {

              region <- gsub(
                " - .*",
                "",
                row
              )


              status <- gsub(

                ".* - (.*?) - .*",

                "\\1",

                row

              )


              history <- gsub(

                ".*Histórico da Redec(.*)",

                "\\1",

                row

              )


              data.frame(

                Region = region,

                Status = status,

                History = history,

                stringsAsFactors = FALSE

              )

            }

          )


          table_df <- do.call(

            rbind,

            table_data

          )


          table_df <- head(

            table_df,

            11

          )


          table_df$Status <-

            str_extract(

              table_df$Status,

              "(?<=-).*"

            ) |>

            str_trim()


          table_df$regiao <-
            table_df$Region


          # ======================================================
          # JOIN FINAL
          # ======================================================

          a <- full_join(

            rj_mun,

            table_df,

            by = "regiao"

          )


          if (
            "Status" %in% names(a)
          ) {

            a$risco_incendio <-
              a$Status

            a$Status <- NULL

          }


          # ======================================================
          # CORREÇÃO ORIGINAL
          # ======================================================

          if (
            nrow(a) >= 93 &&
            nrow(a) >= 5
          ) {

            a$risco_atual_hidrologico[5] <-
              a$risco_atual_hidrologico[93]

            a$risco_atual_geologico[5] <-
              a$risco_atual_geologico[93]

            a$risco_incendio[5] <-
              a$risco_incendio[93]

            if (
              "Region" %in% names(a)
            ) {

              a$Region[5] <-
                "BAIXADA LITORÂNEA"

            }

            a$regiao[5] <-
              "BAIXADA LITORÂNEA"

          }


          # ======================================================
          # MANTER 92 MUNICÍPIOS
          # ======================================================

          rj_mun <- head(
            a,
            92
          )


          # ======================================================
          # VALIDAÇÃO FINAL
          # ======================================================

          cat("\n")
          cat("====================================================\n")
          cat(" VALIDAÇÃO FINAL\n")
          cat("====================================================\n")


          cat(
            "Linhas:",
            nrow(rj_mun),
            "\n"
          )


          cat(
            "Colunas:",
            ncol(rj_mun),
            "\n"
          )


          if (
            nrow(rj_mun) != 92
          ) {

            stop(

              paste0(

                "Esperados 92 municípios; encontrados ",

                nrow(rj_mun)

              ),

              call. = FALSE

            )

          }


          colunas_obrigatorias <- c(

            "regiao",

            "risco_atual_hidrologico",

            "risco_atual_geologico",

            "risco_metereologico",

            "risco_incendio"

          )


          faltantes <- setdiff(

            colunas_obrigatorias,

            names(rj_mun)

          )


          if (
            length(faltantes) > 0
          ) {

            stop(

              paste0(

                "Colunas ausentes: ",

                paste(
                  faltantes,
                  collapse = ", "
                )

              ),

              call. = FALSE

            )

          }


          municipios_validos <- sum(

            !is.na(
              rj_mun$name_muni
            )

          )


          if (
            municipios_validos != 92
          ) {

            stop(

              paste0(

                "Municípios válidos: ",

                municipios_validos,

                ". Esperado: 92."

              ),

              call. = FALSE

            )

          }


          # ======================================================
          # EXPORTAÇÃO
          # ======================================================

          cat("\n")
          cat("====================================================\n")
          cat(" EXPORTAÇÃO\n")
          cat("====================================================\n")


          save(

            rj_mun,

            file = output_path

          )


          writeLines(

            c(

              "STATUS: SUCESSO",

              paste0(
                "REGISTROS: ",
                nrow(rj_mun)
              ),

              paste0(
                "COLUNAS: ",
                ncol(rj_mun)
              ),

              paste0(
                "DATA: ",
                format(
                  Sys.time(),
                  "%Y-%m-%d %H:%M:%S"
                )
              ),

              paste0(
                "GPKG: ",
                gpkg_path
              ),

              paste0(
                "URL_GPKG: ",
                Sys.getenv(
                  "CEMADEN_GPKG_URL"
                )
              )

            ),

            "cemaden_status.txt"

          )


          cat("\n")
          cat("====================================================\n")
          cat(" CEMADEN/RJ ATUALIZADO COM SUCESSO\n")
          cat("====================================================\n")


          EOF_R


      # ==========================================================
      # EXECUTAR COLETOR
      # ==========================================================

      - name: Executar coletor CEMADEN

        shell: bash

        run: |

          set -e

          Rscript atualiza_cemaden.R


          if [ ! -s base_cemaden.rda ]; then

            echo "ERRO: base_cemaden.rda não foi criada."

            exit 1

          fi


          echo ""
          echo "Base gerada:"

          ls -lh base_cemaden.rda


          echo ""
          echo "Status:"

          cat cemaden_status.txt


      # ==========================================================
      # VALIDAR RDA
      # ==========================================================

      - name: Validar base RDA

        shell: bash

        run: |

          set -e

          Rscript - <<'EOF_R'

          load(
            "base_cemaden.rda"
          )


          if (
            !exists("rj_mun")
          ) {

            stop(
              "Objeto rj_mun não encontrado."
            )

          }


          if (
            nrow(rj_mun) != 92
          ) {

            stop(

              paste0(

                "Esperados 92 municípios; encontrados ",

                nrow(rj_mun)

              )

            )

          }


          cat(
            "VALIDAÇÃO RDA OK\n"
          )


          cat(
            "Municípios:",
            nrow(rj_mun),
            "\n"
          )


          cat(
            "Colunas:",
            ncol(rj_mun),
            "\n"
          )

          EOF_R


      # ==========================================================
      # ARTEFATO
      # ==========================================================

      - name: Publicar artefato

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: base-cemaden-rj

          path: |

            base_cemaden.rda

            cemaden_status.txt

          retention-days: 30


      # ==========================================================
      # COMMITAR RESULTADOS
      # ==========================================================

      - name: Commitar resultados

        if: always()

        shell: bash

        run: |

          set -e

          git config --global user.name \
            "github-actions[bot]"

          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"


          git add \
            base_cemaden.rda \
            cemaden_status.txt


          if ! git diff --cached --quiet; then

            git commit \
              -m "🌧️ CEMADEN RJ - $(date '+%Y-%m-%d %H:%M:%S')"


            git pull origin main \
              --rebase \
              --autostash || true


            git push origin main

          else

            echo "Nenhuma alteração para commit."

          fi


      # ==========================================================
      # SSH - SHINY SERVER
      #
      # Secrets:
      #
      # DEPLOY_HOST
      # DEPLOY_USER
      # DEPLOY_KEY
      # ==========================================================

      - name: Configurar SSH do Shiny

        if: >-
          ${{ secrets.DEPLOY_HOST != '' &&
              secrets.DEPLOY_USER != '' &&
              secrets.DEPLOY_KEY != '' }}

        shell: bash

        env:

          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

        run: |

          set -e

          mkdir -p ~/.ssh


          printf '%s\n' "$DEPLOY_KEY" \
            > ~/.ssh/cemaden_deploy


          chmod 600 \
            ~/.ssh/cemaden_deploy


          ssh-keyscan -H \
            "${{ secrets.DEPLOY_HOST }}" \
            >> ~/.ssh/known_hosts


      # ==========================================================
      # COPIAR BASE DIRETAMENTE PARA O SHINY
      # ==========================================================

      - name: Atualizar base do Shiny

        if: >-
          ${{ secrets.DEPLOY_HOST != '' &&
              secrets.DEPLOY_USER != '' &&
              secrets.DEPLOY_KEY != '' }}

        shell: bash

        run: |

          set -e


          scp \
            -i ~/.ssh/cemaden_deploy \
            -o StrictHostKeyChecking=yes \
            base_cemaden.rda \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/shiny-server/cemaden/base_cemaden.rda"


      # ==========================================================
      # ATUALIZAR APP.R
      # ==========================================================

      - name: Atualizar app.R

        if: >-
          ${{ secrets.DEPLOY_HOST != '' &&
              secrets.DEPLOY_USER != '' &&
              secrets.DEPLOY_KEY != '' }}

        shell: bash

        run: |

          set -e


          ssh \
            -i ~/.ssh/cemaden_deploy \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "touch /srv/shiny-server/cemaden/app.R"


      # ==========================================================
      # VERIFICAR DEPLOY
      # ==========================================================

      - name: Verificar atualização no Shiny

        if: >-
          ${{ secrets.DEPLOY_HOST != '' &&
              secrets.DEPLOY_USER != '' &&
              secrets.DEPLOY_KEY != '' }}

        shell: bash

        run: |

          set -e


          ssh \
            -i ~/.ssh/cemaden_deploy \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "ls -lh /srv/shiny-server/cemaden/base_cemaden.rda"


          echo "Deploy CEMADEN concluído."


      # ==========================================================
      # LIMPAR SSH
      # ==========================================================

      - name: Limpar chave SSH

        if: always()

        shell: bash

        run: |

          rm -f ~/.ssh/cemaden_deploy


      # ==========================================================
      # FINAL
      # ==========================================================

      - name: Finalização

        if: success()

        shell: bash

        run: |

          echo ""

