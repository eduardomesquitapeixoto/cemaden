SHAPE_BASE64

          base64 -d /tmp/rj_mun.gpkg.b64 > "${CEMADEN_GPKG}"

          test -s "${CEMADEN_GPKG}"

          echo "GPKG reconstruído:"
          ls -lh "${CEMADEN_GPKG}"

      - name: Criar e executar script R
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/atualiza_cemaden.R <<'RSCRIPT'
          options(
            warn = 1,
            stringsAsFactors = FALSE
          )

          suppressPackageStartupMessages({
            library(logger)
            library(purrr)
            library(httr)
            library(dplyr)
            library(stringr)
            library(xml2)
            library(rvest)
            library(janitor)
            library(magrittr)
            library(rlang)
            library(sf)
          })

          logger::log_info("==============================================")
          logger::log_info("ATUALIZAÇÃO CEMADEN/RJ")
          logger::log_info("Início: {format(Sys.time(), '%Y-%m-%d %H:%M:%S')}")
          logger::log_info("==============================================")

          gpkg_path <- "/tmp/cemaden/data/rj_mun.gpkg"

          output_path <- "output/base_cemaden.rda"

          dir.create(
            dirname(output_path),
            recursive = TRUE,
            showWarnings = FALSE
          )

          if (!file.exists(gpkg_path)) {
            stop(
              paste0("GPKG não encontrado: ", gpkg_path),
              call. = FALSE
            )
          }

          config <- httr::config(
            ssl_verifypeer = 0L
          )

          base_url <- "https://painelcemadenrj.defesacivil.rj.gov.br"

          baixar_html <- function(url) {
            logger::log_info("GET: {url}")

            resposta <- httr::RETRY(
              verb = "GET",
              url = url,
              config = config,
              times = 4,
              pause_base = 2,
              pause_cap = 15,
              quiet = FALSE,
              httr::timeout(90)
            )

            httr::stop_for_status(resposta)

            conteudo <- httr::content(
              resposta,
              as = "text",
              encoding = "UTF-8"
            )

            if (is.null(conteudo) || nchar(conteudo) == 0) {
              stop(
                paste0("Resposta vazia: ", url),
                call. = FALSE
              )
            }

            conteudo
          }

          # --------------------------------------------------
          # WEBSCRAPING 1
          # --------------------------------------------------

          logger::log_info("Webscraping 1 - hidro/geo")

          base1 <- purrr::map(
            c("hidro", "geo"),
            function(tipo) {

              url <- paste0(
                base_url,
                "/monitoramento/v2/municipio/?action=",
                tipo
              )

              baixar_html(url) |>
                xml2::read_html() |>
                rvest::html_table() |>
                purrr::pluck(1) |>
                magrittr::extract(-1, , drop = FALSE) |>
                janitor::clean_names()
            }
          ) |>
            purrr::reduce(
              full_join,
              by = "municipio"
            ) |>
            janitor::clean_names() |>
            arrange(municipio)

          base1 <- rlang::set_names(
            base1,
            gsub("_x", "_hidrologico", names(base1))
          )

          base1 <- rlang::set_names(
            base1,
            gsub("_y", "_geologico", names(base1))
          )

          logger::log_info(
            "Webscraping 1: {nrow(base1)} registros"
          )

          # --------------------------------------------------
          # WEBSCRAPING 2
          # --------------------------------------------------

          logger::log_info("Webscraping 2 - REDEC")

          base2 <- purrr::map(
            c("1", "2"),
            function(tipo) {

              url <- paste0(
                base_url,
                "/monitoramento/v2/mapa/redec.php?action=",
                tipo
              )

              baixar_html(url) |>
                xml2::read_html() |>
                rvest::html_elements(
                  xpath =
                    '//*[contains(concat( " ", @class, " " ),
                    concat( " ", "bg-success", " " ))]'
                ) |>
                rvest::html_text() |>
                tibble::as_tibble() |>
                mutate(
                  regiao = str_extract(
                    value,
                    "^[^-]+"
                  ) |> str_trim(),

                  nivel = str_extract(
                    value,
                    "(?<=- ).*(?=-)"
                  ) |> str_trim()
                ) |>
                select(-value) |>
                clean_names()
            }
          ) |>
            purrr::reduce(
              full_join,
              by = "regiao"
            ) |>
            clean_names() |>
            mutate(
              risco_metereologico = nivel_x,
              risco_incendio = nivel_y
            ) |>
            select(
              -nivel_x,
              -nivel_y
            )

          logger::log_info(
            "Webscraping 2: {nrow(base2)} regiões"
          )

          # --------------------------------------------------
          # CONSOLIDAÇÃO
          # --------------------------------------------------

          base3 <- base1 |>
            select(
              municipio,
              redec_hidrologico,
              risco_atual_hidrologico,
              risco_atual_geologico
            ) |>
            mutate(
              regiao = str_squish(redec_hidrologico)
            ) |>
            full_join(
              base2,
              by = "regiao"
            ) |>
            select(
              regiao,
              municipio,
              risco_atual_hidrologico,
              risco_atual_geologico,
              risco_metereologico,
              risco_incendio
            )

          # --------------------------------------------------
          # MALHA
          # --------------------------------------------------

          logger::log_info("Carregando GPKG")

          rj_mun <- sf::read_sf(
            gpkg_path,
            quiet = TRUE
          ) |>
            mutate(
              mun_tipo_6 = toupper(name_muni)
            ) |>
            full_join(
              base3,
              by = c("mun_tipo_6" = "municipio")
            )

          logger::log_info(
            "Após junção: {nrow(rj_mun)} registros"
          )

          # --------------------------------------------------
          # WEBSCRAPING 3
          # --------------------------------------------------

          logger::log_info("Webscraping 3 - histórico REDEC")

          url <- paste0(
            base_url,
            "/monitoramento/v2/mapa/redec.php?action=2"
          )

          page <- baixar_html(url) |>
            xml2::read_html()

          ul_element <- rvest::html_elements(
            page,
            "ul.list-group"
          )

          html_table <- rvest::html_text(
            ul_element
          )

          if (length(html_table) == 0) {
            stop(
              "ul.list-group não encontrado no Webscraping 3.",
              call. = FALSE
            )
          }

          table_rows <- strsplit(
            html_table,
            "Histórico da Redec"
          )[[1]]

          table_rows <- trimws(table_rows)

          table_data <- lapply(
            table_rows,
            function(row) {

              region <- gsub(
                " - .*",
                "",
                row
              )

              status <- gsub(
                ".* - (.*?) - .*",
                "\\1",
                row
              )

              history <- gsub(
                ".*Histórico da Redec(.*)",
                "\\1",
                row
              )

              data.frame(
                Region = region,
                Status = status,
                History = history,
                stringsAsFactors = FALSE
              )
            }
          )

          table_df <- do.call(
            rbind,
            table_data
          )

          table_df <- head(
            table_df,
            11
          )

          table_df$Status <- str_extract(
            table_df$Status,
            "(?<=-).*"
          ) |> str_trim()

          table_df$regiao <- table_df$Region

          # --------------------------------------------------
          # JUNÇÃO FINAL
          # --------------------------------------------------

          a <- full_join(
            rj_mun,
            table_df,
            by = "regiao"
          )

          if ("Status" %in% names(a)) {
            a$risco_incendio <- a$Status
            a$Status <- NULL
          }

          # --------------------------------------------------
          # CORREÇÃO HISTÓRICA ORIGINAL
          # --------------------------------------------------

          if (nrow(a) >= 93 && nrow(a) >= 5) {

            a$risco_atual_hidrologico[5] <-
              a$risco_atual_hidrologico[93]

            a$risco_atual_geologico[5] <-
              a$risco_atual_geologico[93]

            a$risco_incendio[5] <-
              a$risco_incendio[93]

            if ("Region" %in% names(a)) {
              a$Region[5] <-
                "BAIXADA LITORÂNEA"
            }

            a$regiao[5] <-
              "BAIXADA LITORÂNEA"
          }

          # --------------------------------------------------
          # 92 MUNICÍPIOS
          # --------------------------------------------------

          rj_mun <- head(
            a,
            92
          )

          # --------------------------------------------------
          # VALIDAÇÕES
          # --------------------------------------------------

          logger::log_info(
            "Validando resultado final"
          )

          if (nrow(rj_mun) != 92) {
            stop(
              paste0(
                "Número de registros inválido: ",
                nrow(rj_mun),
                ". Esperado: 92."
              ),
              call. = FALSE
            )
          }

          colunas_obrigatorias <- c(
            "regiao",
            "risco_atual_hidrologico",
            "risco_atual_geologico",
            "risco_metereologico",
            "risco_incendio"
          )

          faltantes <- setdiff(
            colunas_obrigatorias,
            names(rj_mun)
          )

          if (length(faltantes) > 0) {
            stop(
              paste0(
                "Colunas ausentes: ",
                paste(faltantes, collapse = ", ")
              ),
              call. = FALSE
            )
          }

          if (!"name_muni" %in% names(rj_mun)) {
            stop(
              "Coluna name_muni ausente.",
              call. = FALSE
            )
          }

          if (sum(!is.na(rj_mun$name_muni)) != 92) {
            stop(
              "Nem todos os 92 municípios possuem name_muni.",
              call. = FALSE
            )
          }

          # --------------------------------------------------
          # EXPORTAÇÃO
          # --------------------------------------------------

          logger::log_info(
            "Exportando base"
          )

          save(
            rj_mun,
            file = output_path
          )

          metadata_path <- sub(
            "\\.rda$",
            "_metadata.txt",
            output_path
          )

          writeLines(
            c(
              "CEMADEN/RJ",
              paste0(
                "Atualização: ",
                format(
                  Sys.time(),
                  "%Y-%m-%d %H:%M:%S"
                )
              ),
              paste0(
                "Municípios: ",
                nrow(rj_mun)
              ),
              paste0(
                "Colunas: ",
                ncol(rj_mun)
              ),
              paste0(
                "Arquivo: ",
                output_path
              )
            ),
            metadata_path
          )

          logger::log_success(
            "=============================================="
          )

          logger::log_success(
            "CEMADEN/RJ ATUALIZADO COM SUCESSO"
          )

          logger::log_success(
            "92 municípios validados"
          )

          logger::log_success(
            "=============================================="
          )
          RSCRIPT

          Rscript /tmp/atualiza_cemaden.R

      - name: Validar arquivo final
        shell: bash
        run: |
          set -euo pipefail

          test -s output/base_cemaden.rda

          Rscript - <<'RSCRIPT'
          load("output/base_cemaden.rda")

          if (!exists("rj_mun")) {
            stop("Objeto rj_mun não encontrado.")
          }

          if (nrow(rj_mun) != 92) {
            stop(
              paste0(
                "Esperados 92 municípios; encontrados ",
                nrow(rj_mun)
              )
            )
          }

          cat("VALIDAÇÃO FINAL OK\n")
          cat("Municípios:", nrow(rj_mun), "\n")
          cat("Colunas:", ncol(rj_mun), "\n")
          RSCRIPT

          ls -lh output/base_cemaden.rda
          cat output/base_cemaden_metadata.txt

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: base-cemaden-rj
          path: |
            output/base_cemaden.rda
            output/base_cemaden_metadata.txt
          retention-days: 30
