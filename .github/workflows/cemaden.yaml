name: Atualização dos dados do CEMADEN RJ

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: atualizacao-cemaden-rj
  cancel-in-progress: false

jobs:
  atualizar-cemaden:
    name: Coletar, validar e publicar CEMADEN/RJ
    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Instalar pacotes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::logger
            any::purrr
            any::httr
            any::dplyr
            any::stringr
            any::xml2
            any::rvest
            any::janitor
            any::magrittr
            any::rlang
            any::sf
          needs: |
            any::logger
            any::purrr
            any::httr
            any::dplyr
            any::stringr
            any::xml2
            any::rvest
            any::janitor
            any::magrittr
            any::rlang
            any::sf

      - name: Reconstruir malha GPKG embutida
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cemaden/data output

          cat > /tmp/rj_mun.gpkg.b64 <<'SHAPE_BASE64'
